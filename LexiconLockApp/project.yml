# XcodeGen spec for the Lexicon Lock app + 3 Screen Time extensions.
# Generate the .xcodeproj with:  cd LexiconLockApp && xcodegen generate
# (install XcodeGen via `brew install xcodegen`). See README.md.
#
# Code signing / team / the Family Controls *distribution* entitlement are left
# for you to configure in Xcode (Signing & Capabilities) — see README + VERIFY.

name: LexiconLock
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set DEVELOPMENT_TEAM in Xcode or here once you have a team + the
    # Family Controls (Distribution) entitlement approved by Apple.

packages:
  LearningGateCore:
    path: ../LearningGateCore

targets:
  # ── Main app ──────────────────────────────────────────────
  LexiconLock:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: LearningGateCore
        product: LearningGateCore
      - target: ShieldConfigurationExt
      - target: ShieldActionExt
      - target: DeviceActivityMonitorExt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lexiconlock
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Lexicon Lock
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        CODE_SIGN_ENTITLEMENTS: App/LexiconLock.entitlements

  # ── Shield UI (custom shield appearance) ──────────────────
  ShieldConfigurationExt:
    type: app-extension
    platform: iOS
    sources:
      - ShieldConfigurationExt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lexiconlock.ShieldConfiguration
        INFOPLIST_FILE: ShieldConfigurationExt/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShieldConfigurationExt/ShieldConfigurationExt.entitlements

  # ── Shield action (button handling) ───────────────────────
  ShieldActionExt:
    type: app-extension
    platform: iOS
    sources:
      - ShieldActionExt
      - path: Shared/AppGroup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lexiconlock.ShieldAction
        INFOPLIST_FILE: ShieldActionExt/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShieldActionExt/ShieldActionExt.entitlements

  # ── DeviceActivity monitor (re-shield when break ends) ────
  DeviceActivityMonitorExt:
    type: app-extension
    platform: iOS
    sources:
      - DeviceActivityMonitorExt
      - path: Shared/AppGroup.swift
      - path: Shared/SelectionStore.swift
      - path: Shared/ShieldApplier.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lexiconlock.DeviceActivityMonitor
        INFOPLIST_FILE: DeviceActivityMonitorExt/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeviceActivityMonitorExt/DeviceActivityMonitorExt.entitlements
